    <body>

        <nav id="navbar" class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>

        <main>
            <h1>What type of journey do you prefer?</h1>

            <!-- JOURNEY TYPE CARD + GO BUTTON (side by side) -->
            <div class="journey-row">

                <section class="select-card">
                    <img src="images/E_type.png" class="card-border" alt="">

                    <h2 class="border-title">CHOOSE YOUR<br>JOURNEY TYPE</h2>

                    <div class="pill">
                        <img src="images/E_choose_here.png" alt="">
                        <label for="journey-type" class="sr-only">Journey type</label>
                        <select id="journey-type" name="journey-type">
                            <option value="">Choose Here</option>
                            <option value="Scenic">Scenic</option>
                            <option value="Foodie">Foodie</option>
                            <option value="Budget">Budget</option>
                        </select>
                    </div>
                </section>

                <button type="button" id="save-type-btn" aria-label="Go">
                    <img src="images/E_button.png" class="next-image" alt="">
                    <span class="next-subtitle">GO!</span>
                </button>

            </div>

            <p id="type-message" aria-live="polite"></p>
        </main>

        <footer>
            <p>&copy; 2026 JeRaiVaNel. All rights reserved.</p>

        <script src="js/journey.js"></script>
